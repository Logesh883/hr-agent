services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hr-postgres
    environment:
      POSTGRES_USER: hr
      POSTGRES_PASSWORD: hr
      POSTGRES_DB: hr
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr -d hr"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
